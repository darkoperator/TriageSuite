[package]
name = "browser-triage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Browser artifact parser (Chromium/Firefox history, downloads, cookies, autofill, bookmarks, login metadata, keyword searches, extensions)"

[[bin]]
name = "BrowserTriage"
path = "src/main.rs"

[dependencies]
triage-core = { path = "../triage-core" }
triage-cli = { path = "../triage-cli" }
triage-sqlite = { path = "../triage-sqlite" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
chrono.workspace = true
tracing.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
# Synthetic fixtures only. rusqlite is already in the build graph via
# triage-sqlite, so this costs no extra compilation.
rusqlite.workspace = true
