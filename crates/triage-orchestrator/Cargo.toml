[package]
name = "triage-orchestrator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "TriageSuite"
path = "src/main.rs"

[lib]
name = "triage_orchestrator"
path = "src/lib.rs"

[dependencies]
triage-core = { path = "../triage-core" }
triage-cli = { path = "../triage-cli" }
pe-triage = { path = "../pe-triage" }
jle-triage = { path = "../jle-triage" }
le-triage = { path = "../le-triage" }
rb-triage = { path = "../rb-triage" }
re-triage = { path = "../re-triage" }
sbe-triage = { path = "../sbe-triage" }
sqle-triage = { path = "../sqle-triage" }
srume-triage = { path = "../srume-triage" }
sum-triage = { path = "../sum-triage" }
wxt-triage = { path = "../wxt-triage" }
evtx-triage = { path = "../evtx-triage" }
triage-evtx = { path = "../triage-evtx" }
mft-triage = { path = "../mft-triage" }
amc-triage = { path = "../amc-triage" }
acc-triage = { path = "../acc-triage" }
browser-triage = { path = "../browser-triage" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
globset = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
# Only for converting a run's --start/--end (chrono, matching the manifest
# and CLI) into EvtxTriage's `ParseOptions` (the `time` crate, matching
# EvtxTriage's own CLI) -- there is no direct conversion between the two
# crates' datetime types, so the round trip goes through RFC3339 text.
time = { version = "0.3", features = ["parsing"] }
sha2 = { workspace = true }
console = "0.15"
zip = { workspace = true }
# Not used directly: supplies zip's deflate backend. See the note in the
# workspace Cargo.toml — zip alone does not compile without it.
flate2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
triage-testkit = { path = "../triage-testkit" }
# Standalone binaries never registered in registry::ALL_KEYS (they run
# outside the capture-triage flow: LolTriage/SrumNetTriage post-process other
# tools' CSV output, AnyDeskTriage has no discovery integration yet). The
# Velo basename guard test constructs them directly so their datasets are
# still checked.
lol-triage = { path = "../lol-triage" }
anydesk-triage = { path = "../anydesk-triage" }
srum-net-triage = { path = "../srum-net-triage" }
# Test-only: `velo_layout.rs` builds a synthetic `*.automaticDestinations-ms`
# (an OLE compound file) so a run can reach JLETriage's *second* dataset.
cfb = { workspace = true }

[lints]
workspace = true
