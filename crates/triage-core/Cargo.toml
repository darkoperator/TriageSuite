[package]
name = "triage-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared infrastructure for the TriageSuite forensic parsers"

[dependencies]
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
chrono.workspace = true
time = { version = "0.3", features = ["formatting", "macros"] }
walkdir.workspace = true
globset.workspace = true
percent-encoding.workspace = true
sha2.workspace = true
sha1.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono-tz = { workspace = true, optional = true }

[features]
# Time zone conversion (`timestamp::zone`) for OxideLens's display zone. Off by
# default: the suite's tools write UTC and never link the zone database.
zones = ["dep:chrono-tz"]

[dev-dependencies]
triage-testkit = { path = "../triage-testkit" }
tempfile.workspace = true

[[test]]
name = "zone"
required-features = ["zones"]

[lints]
workspace = true
