[package]
name = "acc-triage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Windows AppCompatCache/ShimCache parser producing AppCompatCacheParser-compatible CSV and JSON"

[[bin]]
name = "AppCompatTriage"
path = "src/main.rs"

[lib]
name = "acc_triage"
path = "src/lib.rs"

[dependencies]
triage-core = { path = "../triage-core" }
triage-cli = { path = "../triage-cli" }
triage-registry = { path = "../triage-registry" }
triage-appcompat = { path = "../triage-appcompat" }
notatin = "1.0.1"
clap.workspace = true
serde.workspace = true
chrono.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
triage-testkit = { path = "../triage-testkit" }
csv.workspace = true
