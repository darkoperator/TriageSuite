# Sample config for `triagesuite run <capture> --out <dir> --config triage.toml`.
# Optional — a bare `triagesuite run <capture> --out <dir>` works with none of this.
# See docs/tools/TriageSuite.md ("Config and profiles") for the full format.

[hayabusa]
bin = "hayabusa"
enabled = true
csv = true
json = true
# A relative rules/rules_config is resolved against Hayabusa's OWN install
# directory (where its bundled rules/ and rules/config/ actually live), not
# against the directory you run `triagesuite` from -- Hayabusa's process is
# always started with its cwd set there. Use an absolute path for either
# field if you keep your Sigma rules somewhere else.
rules = "./rules"
rules_config = "./rules/config"
min_level = "informational"
proven_rules = false
# threads: omit to let Hayabusa pick (one worker per core). Do NOT set 0 --
# it is passed through as `--threads 0`, and Hayabusa 4 panics on it with
# "Worker threads cannot be set to 0", which surfaces here as a failed
# external-tool step rather than as a config error.
# threads = 4

[takajo]
bin = "takajo"
enabled = true
level = ""
display_table = false

# Named profiles apply on top of the base [hayabusa]/[takajo] tables above via
# --profile <name>; a profile only needs to state the fields it changes.
[profiles.quick.hayabusa]
min_level = "high"
proven_rules = true
# rules, csv, json, etc. all inherited from [hayabusa]

[profiles.quick.takajo]
enabled = false   # skip takajo for a quick pass
