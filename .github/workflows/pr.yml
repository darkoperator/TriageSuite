name: PR checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Public runners never have real forensic evidence captures; let
      # capture-gated tests skip instead of failing loudly (see
      # crates/triage-testkit for the gate this satisfies).
      TRIAGE_ALLOW_COMPAT_SKIP: "1"
      # And the mirror image: the DuckDB assertions must fail, not skip, if
      # the binary installed below never arrived.
      TRIAGE_REQUIRE_DUCKDB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The DuckDB view assertions are the only proof the generated
      # duckdb/views.sql actually loads. Unlike the capture-gated tests they
      # need no evidence tree, so this job can -- and below, must -- run them
      # for real rather than skipping them.
      #
      # Straight from the upstream release, not a third-party setup action:
      # one less supply-chain surface, and no dependency on someone else's
      # tag scheme. This step first shipped as `opt-nc/setup-duckdb-action@v1`
      # and failed the whole job in 2s before a single test ran, because that
      # action publishes only exact patch tags -- there is no floating `v1`.
      # `duckdb --version` at the end so a bad download fails here, loudly,
      # rather than as a confusing TRIAGE_REQUIRE_DUCKDB panic later.
      - name: Install DuckDB
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip
          unzip -q -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install -m 0755 /tmp/duckdb/duckdb /usr/local/bin/duckdb
          duckdb --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib
      - run: cargo test -p triage-orchestrator --test e2e
      - run: cargo test -p triage-orchestrator --test external_tools_e2e
      - run: cargo test -p triage-orchestrator --test zip_e2e
      - run: cargo test -p triage-orchestrator --test duckdb_e2e
      - run: cargo test -p triage-core
      # timestamp::zone is behind triage-core's `zones` feature, which no suite
      # crate enables and the oxidelens job does not test, so lint and test it
      # here or nothing does.
      - run: cargo clippy -p triage-core --all-targets --features zones -- -D warnings
      - run: cargo test -p triage-core --features zones --test zone --lib

  # OxideLens is a cargo workspace of its own, excluded from the root one
  # because it bundles DuckDB; it gets its own job and its own cache so the
  # suite's job never compiles DuckDB.
  oxidelens:
    runs-on: ubuntu-latest
    env:
      # As in the suite's job: no evidence here, so a capture-gated test that
      # was asked for skips instead of panicking.
      TRIAGE_ALLOW_COMPAT_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxidelens
      # The desktop app (crates/oxl-app) links WebKitGTK on Linux.
      - name: Install the app's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: cargo fmt --all -- --check
        working-directory: oxidelens
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: oxidelens
      - run: cargo test
        working-directory: oxidelens
      # The front end (oxidelens/app): lint, test, build. The app itself makes
      # no network requests; `npm ci` needs the registry for dev tooling only.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oxidelens/app/package-lock.json
      - run: npm --prefix oxidelens/app ci
      - run: npm --prefix oxidelens/app run lint
      - run: npm --prefix oxidelens/app test
      - run: npm --prefix oxidelens/app run build
