name: PR checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Public runners never have real forensic evidence captures; let
      # capture-gated tests skip instead of failing loudly (see
      # crates/triage-testkit for the gate this satisfies).
      TRIAGE_ALLOW_COMPAT_SKIP: "1"
      # And the mirror image: the DuckDB assertions must fail, not skip, if
      # the binary installed below never arrived.
      TRIAGE_REQUIRE_DUCKDB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The DuckDB view assertions are the only proof the generated
      # duckdb/views.sql actually loads. Unlike the capture-gated tests they
      # need no evidence tree, so this job can -- and below, must -- run them
      # for real rather than skipping them.
      #
      # Straight from the upstream release, not a third-party setup action:
      # one less supply-chain surface, and no dependency on someone else's
      # tag scheme. This step first shipped as `opt-nc/setup-duckdb-action@v1`
      # and failed the whole job in 2s before a single test ran, because that
      # action publishes only exact patch tags -- there is no floating `v1`.
      # `duckdb --version` at the end so a bad download fails here, loudly,
      # rather than as a confusing TRIAGE_REQUIRE_DUCKDB panic later.
      - name: Install DuckDB
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip
          unzip -q -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install -m 0755 /tmp/duckdb/duckdb /usr/local/bin/duckdb
          duckdb --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib
      - run: cargo test -p triage-orchestrator --test e2e
      - run: cargo test -p triage-orchestrator --test external_tools_e2e
      - run: cargo test -p triage-orchestrator --test zip_e2e
      - run: cargo test -p triage-orchestrator --test duckdb_e2e
      - run: cargo test -p triage-core
