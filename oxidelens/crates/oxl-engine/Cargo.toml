[package]
name = "oxl-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The OxideLens case engine: a DuckDB case file over TriageSuite output"

[dependencies]
# `zones`: every display-zone conversion goes through triage_core::timestamp::zone.
triage-core = { workspace = true, features = ["zones"] }
duckdb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
regex.workspace = true
# The SQL lockdown's ATTACH probe names a file in a directory of its own.
tempfile.workspace = true
# A case's id (ox.meta case_id), from the operating system's random source.
getrandom.workspace = true
# The grid's CSV export.
csv.workspace = true
# TypeScript bindings of the app's contract types, only with feature `ts`.
ts-rs = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW and O_NONBLOCK, so a run's session file is never read through a
# link or blocks on a FIFO.
libc.workspace = true

[features]
# TypeScript bindings of the app's contract types (`ts-rs`), derived only in
# a build that asks for them: oxl-app does, because it generates and checks
# the contract; a build of the CLI alone never sees them.
ts = ["dep:ts-rs"]
# Constructors only tests may call (`Case::create_at_format_1`): this crate's
# own tests turn it on through the dev-dependency on itself below.
test-support = []

[dev-dependencies]
# Integration tests (files under tests/). oxl-fixtures depends on this crate,
# so a unit test inside src/ links a second copy: it may take a directory
# tree from it (`two_hosts`) but never a `Case` or any other engine type.
oxl-fixtures.workspace = true
tempfile.workspace = true
triage-testkit.workspace = true
# This crate again, with the test-only constructors (`test-support`).
oxl-engine = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
