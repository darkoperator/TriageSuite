[package]
name = "oxl-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The oxidelens command line: a stable JSON contract over the OxideLens engine"

[lib]
name = "oxl_cli"

[[bin]]
name = "oxidelens"
path = "src/main.rs"

[dependencies]
oxl-engine.workspace = true
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
# The untrusted-data boundary must be unpredictable to whoever wrote the
# evidence, so it comes from the operating system's random source.
getrandom = "0.3"

[dev-dependencies]
oxl-fixtures.workspace = true
assert_cmd.workspace = true
tempfile.workspace = true

[lints]
workspace = true
