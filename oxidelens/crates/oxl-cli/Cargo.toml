[package]
name = "oxl-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The oxidelens command line: a stable JSON contract over the OxideLens engine"

[lib]
name = "oxl_cli"

[[bin]]
name = "oxidelens"
path = "src/main.rs"

[dependencies]
oxl-engine.workspace = true
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
oxl-fixtures.workspace = true
# To write a case the engine never would (a newer format) in a test.
duckdb.workspace = true
assert_cmd.workspace = true
tempfile.workspace = true

[lints]
workspace = true
