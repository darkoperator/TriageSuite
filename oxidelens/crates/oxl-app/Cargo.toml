[package]
name = "oxl-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The OxideLens desktop app: Tauri commands over the case engine"
publish = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# With `ts`: the app owns the TypeScript contract, generated from the
# engine's types and its own (`contract`), and checked by `tests/contract.rs`
# in every `cargo test`.
oxl-engine = { workspace = true, features = ["ts"] }
ts-rs.workspace = true
# The display zones the app offers (`zone_names`).
triage-core = { workspace = true, features = ["zones"] }
# The interrupt handle a running query is stopped through.
duckdb.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-mcp-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
# The stamp a damaged settings file is set aside under.
chrono.workspace = true

[dev-dependencies]
oxl-fixtures.workspace = true
tempfile.workspace = true
# The mock runtime, so a test can call every command through Tauri's own IPC
# with the argument names the TypeScript contract gives.
tauri = { workspace = true, features = ["test"] }
# The engine's test-only variants (`test-support`), which the unit tests in
# `cmd::record` hold mid-way: a record export before its rename, a sightings
# sweep between relations. Only `cfg(test)` code calls them.
oxl-engine = { workspace = true, features = ["ts", "test-support"] }

[lints]
workspace = true
