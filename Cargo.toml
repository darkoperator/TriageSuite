[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Carlos (DarkOperator) Perez <carlos_perez@darkoperator.com>"]
license = "MIT"

# Lints applied to every workspace member (each crate opts in with
# `[lints] workspace = true`). Kept to rules the tree already satisfies, so a
# violation always means new debt rather than a pre-existing backlog.
#
# Deliberately NOT enabled yet: unwrap_used, expect_used, indexing_slicing and
# arithmetic_side_effects. They are the right lints for a parser reading
# hostile evidence -- the i64::MIN.abs() panic in chromium/logins.rs is exactly
# what arithmetic_side_effects flags -- but browser-triage alone has ~40 hits,
# nearly all of them counter increments and length-checked slices. Turning them
# on today would produce a wall of #[allow]s, which is the opposite of the
# point. The boundary-value harness in triage-testkit covers that class in the
# meantime; enable these per crate as each one is cleaned.
[workspace.lints.rust]
# The suite parses attacker-controlled evidence. There is no unsafe block in
# the tree today and none is needed; forbid (not deny) so a crate cannot
# re-enable it locally.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Debugging leftovers must never reach a release binary.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Decode tables are written as bit constants transcribed from an upstream
# header; a mistyped suffix or an odd digit grouping is how a transcription
# error hides in plain sight.
mistyped_literal_suffixes = "deny"
unusual_byte_groupings = "deny"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON property order = struct declaration order = CSV
# column order when records round-trip through serde_json::Value (spec: one
# record model serves both writers).
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1.3"
chrono = "0.4"
walkdir = "2"
globset = "0.4"
percent-encoding = "2"
sha2 = "0.10"
sha1 = "0.10"
thiserror = "2"
toml = "0.8"
cfb = "0.14"
xpress-huffman = "0.1"
encoding_rs = "0.8"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
regex = "1"
base64 = "0.22"
serde_yaml = "0.9"
nom = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
include_dir = "0.7"
ureq = "2"
# Pure-Rust zip stack. default-features would pull bzip2/zstd/lzma/aes C code,
# which the 5-target cargo-zigbuild release cannot afford. `zip`'s
# deflate-flate2 feature enables flate2 with default-features = false, which
# hits flate2's "you need to choose a zlib backend" compile_error, so flate2 is
# declared directly with rust_backend (miniz_oxide — safe Rust, already in the
# lockfile via ureq).
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ese_parser_lib = { git = "https://github.com/darkoperator/ese_parser", package = "ese_parser_lib", rev = "7cf0ecd88740157fce9ab94dc699ed4811a29e26" }

[profile.release]
strip = true
